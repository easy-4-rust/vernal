[package]
name = "vernal-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Procedural macro boundary for Vernal."
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full", "visit-mut"] }

[dev-dependencies]
tokio.workspace = true
vernal-aop = { path = "../vernal-aop" }
vernal-context = { path = "../vernal-context" }
trybuild = "1.0.116"
vernal-ioc = { path = "../vernal-ioc" }

[lints]
workspace = true
