[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
authors = ["Vernal Contributors"]
description = "A lightweight IoC, AOP and application context framework for Rust."

[workspace.dependencies]
bytes = "1.11.1"
futures-core = "0.3.32"
futures-util = "0.3.32"
http = "1.4.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "server", "tokio"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
