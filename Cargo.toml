[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
authors = ["Vernal Contributors"]
description = "A lightweight IoC, AOP and application context framework for Rust."

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
