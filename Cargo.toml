[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
authors = ["Vernal Contributors"]
description = "A lightweight IoC, AOP and application context framework for Rust."

[workspace.dependencies]
actix-http = "=3.11.2"
actix-web = { version = "=4.11.0", default-features = false, features = ["macros"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
bytes = "1.11.1"
criterion = { version = "=0.7.0", default-features = false, features = ["async_tokio"] }
futures-core = "0.3.32"
futures-lite = "2.6.1"
futures-util = "0.3.32"
gotham = { version = "=0.8.0", default-features = false }
http = "1.4.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "server", "tokio"] }
linkme = "=0.3.37"
ntex = { version = "=2.18.0", default-features = false, features = ["tokio"] }
poem = { version = "=3.1.12", default-features = false }
rocket = { version = "=0.5.1", default-features = false }
salvo = { version = "=0.85.0", default-features = false, features = ["matched-path"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sync_wrapper = "1.0.2"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tonic = { version = "0.12.3", default-features = false }
tower = { version = "0.5.3", features = ["util"] }
tide = { version = "=0.17.0-beta.1", default-features = false }
warp = { version = "=0.4.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
